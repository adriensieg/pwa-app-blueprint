<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ app_title }}</title>
  <base href="{{ root_path }}/">
  <meta name="theme-color" content="#2563eb">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ root_path }}/static/style.css">
</head>
<body data-root="{{ root_path }}">
  <div class="app-shell">
    <header class="app-header">
      <a href="/" class="back-link" aria-label="Back to home"><i class="bi bi-chevron-left"></i></a>
      <h1 class="app-title">{{ app_title }}</h1>
      <span class="badge rounded-pill" id="count">0</span>
    </header>

    <main class="app-main">
      <form id="add-form" class="add-form">
        <input type="text" id="task-input" class="form-control form-control-lg"
               placeholder="Add equipment…" autocomplete="off" required>
        <button type="submit" class="btn btn-primary btn-lg" aria-label="Add">
          <i class="bi bi-plus-lg"></i>
        </button>
      </form>

      <ul id="task-list" class="task-list list-unstyled"></ul>

      <p id="empty-state" class="empty-state d-none">
        <i class="bi bi-camera"></i><br>No equipment yet.
      </p>
    </main>
  </div>

  <div class="modal fade" id="edit-modal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Edit</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="text" id="edit-input" class="form-control form-control-lg">
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-primary" id="edit-save">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ root_path }}/static/script.js"></script>
</body>
</html>
