<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ app_title }}</title>

  <!-- PWA: only the hub owns the manifest + apple meta -->
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="{{ app_title }}">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/static/icons/icon-180.png">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app-shell">
    <header class="hub-header">
      <div class="hub-logo"><img src="/static/icons/icon-192.png" alt=""></div>
      <h1 class="hub-title">{{ app_title }}</h1>
      <p class="hub-tagline">Your home equipment companion.</p>
    </header>

    <main class="app-main">
      <h2 class="section-label">Services</h2>
      <div class="service-grid">
        {% for s in services %}
        <a class="service-card" href="{{ s.path }}">
          <span class="service-icon"><i class="bi {{ s.icon }}"></i></span>
          <span class="service-body">
            <span class="service-name">{{ s.name }}</span>
            <span class="service-desc">{{ s.desc }}</span>
          </span>
          <i class="bi bi-chevron-right service-arrow"></i>
        </a>
        {% endfor %}
      </div>

      <button id="notif-btn" class="btn btn-outline-primary btn-lg w-100 mt-3 d-none">
        <i class="bi bi-bell"></i> Enable reminders
      </button>
    </main>
  </div>

  <!-- iOS "Add to Home Screen" popup (hub only) -->
  <div id="ios-install" class="ios-install" hidden>
    <div class="ios-install-card">
      <button class="ios-install-close" id="ios-install-close" aria-label="Close">
        <i class="bi bi-x-lg"></i>
      </button>
      <div class="ios-install-icon"><img src="/static/icons/icon-192.png" alt=""></div>
      <h2 class="ios-install-title">Install {{ app_title }}</h2>
      <p class="ios-install-text">Add to your Home Screen for the full app experience.</p>
      <ol class="ios-install-steps">
        <li>Tap the Share button <i class="bi bi-box-arrow-up"></i></li>
        <li>Choose <strong>Add to Home Screen</strong> <i class="bi bi-plus-square"></i></li>
      </ol>
      <div class="ios-install-arrow"><i class="bi bi-chevron-compact-down"></i></div>
    </div>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
