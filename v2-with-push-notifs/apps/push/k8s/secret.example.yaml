# Generate keys, then create the secret (do NOT commit real keys):
#   kubectl create secret generic vapid-keys -n mcd \
#     --from-literal=public=<VAPID_PUBLIC_KEY> \
#     --from-literal=private=<VAPID_PRIVATE_KEY>
apiVersion: v1
kind: Secret
metadata:
  name: vapid-keys
  namespace: mcd
type: Opaque
stringData:
  public: REPLACE_WITH_VAPID_PUBLIC_KEY
  private: REPLACE_WITH_VAPID_PRIVATE_KEY
